<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noti-sub Prototype v0.2 — Build AU</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
:root {
  --ink:#1d1d1f; --ink-med:#4a4a4c; --ink-light:#86868b; --ink-faint:#aeaeb2;
  --bg:#f5f5f7; --card:#ffffff; --card-hover:#fcfcfd;
  --border:#e5e5ea; --border-light:#f0f0f2;
  --positive:#34c759; --positive-bg:#eafaf0; --positive-text:#1a7a32;
  --negative:#ff3b30; --negative-bg:#fef0ef; --negative-text:#b81d14;
  --warning:#ff9500; --warning-bg:#fff4e5; --warning-text:#8a5d00;
  --neutral-bg:#f2f2f7;
  --info-bg:#e8f4fd; --info-text:#1a6fa0;
  --purple-bg:#f0eafa; --purple-text:#5a3d9e;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.04),0 1px 2px rgba(0,0,0,0.06);
  --shadow-md:0 4px 12px rgba(0,0,0,0.06),0 1px 4px rgba(0,0,0,0.04);
  --shadow-lg:0 8px 24px rgba(0,0,0,0.08),0 2px 8px rgba(0,0,0,0.04);
  --radius:12px; --radius-sm:8px; --sidebar-w:56px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',-apple-system,sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased; display:flex; min-height:100vh; font-size:13px; }
button { font-family:'Inter',sans-serif; }
a { color:var(--info-text); text-decoration:none; cursor:pointer; }
a:hover { text-decoration:underline; }

/* Shell */
.sidebar { width:var(--sidebar-w); background:var(--card); border-right:1px solid var(--border); display:flex; flex-direction:column; align-items:center; padding:12px 0; position:fixed; top:0; left:0; bottom:0; z-index:60; }
.sidebar-logo { width:32px; height:32px; margin-bottom:20px; display:flex; align-items:center; justify-content:center; border-radius:8px; background:var(--ink); }
.sidebar-logo svg { width:18px; height:18px; fill:white; }
.sidebar-nav { display:flex; flex-direction:column; align-items:center; gap:4px; flex:1; }
.sidebar-item { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; border:none; background:none; position:relative; transition:all .15s; }
.sidebar-item svg { width:20px; height:20px; fill:var(--ink-faint); transition:fill .15s; }
.sidebar-item:hover { background:var(--neutral-bg); }
.sidebar-item:hover svg { fill:var(--ink-med); }
.sidebar-item.active { background:#eef0f8; }
.sidebar-item.active svg { fill:var(--ink); }
.sidebar-item.active::before { content:''; position:absolute; left:-8px; top:50%; transform:translateY(-50%); width:3px; height:20px; border-radius:0 3px 3px 0; background:var(--ink); }
.main-area { flex:1; margin-left:var(--sidebar-w); min-height:100vh; display:flex; flex-direction:column; min-width:0; }
.topbar { background:var(--card); border-bottom:1px solid var(--border); padding:0 32px; height:52px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; }
.logo { font-weight:700; font-size:16px; color:var(--ink); letter-spacing:-.3px; }
.logo span { font-weight:300; color:var(--ink-light); margin-left:6px; font-size:13px; }
.topbar-right { display:flex; align-items:center; gap:14px; }
.topbar-search { width:220px; padding:7px 12px 7px 32px; border:1px solid var(--border); border-radius:8px; font-size:12px; font-family:'Inter',sans-serif; color:var(--ink); background:var(--bg); outline:none; }
.topbar-search-wrap { position:relative; }
.topbar-search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:12px; color:var(--ink-faint); }
.avatar-sm { width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,#d8b4fe,#a78bfa); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; color:white; }
.user-meta { font-size:12px; line-height:1.25; text-align:right; }
.user-meta b { font-weight:600; color:var(--ink); display:block; }
.user-meta span { color:var(--ink-light); font-size:11px; }
.page { max-width:1320px; margin:0 auto; padding:20px 32px 90px; width:100%; }
.proto-tag { position:fixed; bottom:16px; right:16px; font-size:11px; color:var(--ink-faint); background:var(--card); padding:4px 12px; border-radius:6px; border:1px solid var(--border); box-shadow:var(--shadow-sm); z-index:100; max-width:760px; }

/* Header */
.crumbs { font-size:12px; color:var(--ink-light); margin-bottom:6px; }
.crumbs a { color:var(--ink-light); }
.page-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:16px; }
.page-title { font-size:20px; font-weight:600; letter-spacing:-.4px; display:flex; align-items:center; gap:10px; }
.page-title .back { border:none; background:none; font-size:18px; color:var(--ink-light); cursor:pointer; padding:2px 6px; border-radius:6px; }
.page-title .back:hover { background:var(--neutral-bg); color:var(--ink); }
.page-sub { font-size:12px; color:var(--ink-light); margin-top:2px; }
.head-actions { display:flex; gap:8px; }

/* Buttons */
.btn { font-size:12px; font-weight:500; padding:7px 14px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--card); color:var(--ink); cursor:pointer; transition:all .15s; white-space:nowrap; display:inline-flex; align-items:center; gap:6px; }
.btn:hover { background:var(--neutral-bg); }
.btn.primary { background:var(--ink); color:white; border-color:var(--ink); }
.btn.primary:hover { background:#3a3a3c; }
.btn.small { font-size:11px; padding:4px 10px; }
.btn.ghost { border-color:transparent; background:none; color:var(--ink-light); }
.btn.ghost:hover { background:var(--neutral-bg); color:var(--ink); }
.btn.danger { color:var(--negative-text); border-color:#ffccc9; }
.btn.danger:hover { background:var(--negative-bg); }
.btn:disabled { opacity:.45; cursor:not-allowed; }

/* Cards / panels */
.card { background:var(--card); border-radius:var(--radius); border:1px solid var(--border-light); box-shadow:var(--shadow-sm); }
.panel { background:var(--card); border-radius:var(--radius); border:1px solid var(--border-light); box-shadow:var(--shadow-sm); display:flex; flex-direction:column; min-height:220px; transition:box-shadow .2s; }
.panel.new { border:1px solid #c9d6f5; box-shadow:0 0 0 3px #eef3fd, var(--shadow-sm); }
.panel-h { display:flex; align-items:center; justify-content:space-between; padding:14px 16px 10px; border-bottom:1px solid var(--border-light); gap:8px; }
.panel-t { font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; }
.panel-b { padding:12px 16px; flex:1; }
.panel-f { padding:10px 16px 14px; }
.panel-f .btn { width:100%; justify-content:center; }
.new-chip { font-size:9px; font-weight:700; letter-spacing:.6px; background:#e7eefc; color:#2f55b8; padding:2px 6px; border-radius:4px; text-transform:uppercase; }
.grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:16px; }
.grid2 { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; margin-bottom:16px; }
.kv { display:grid; grid-template-columns:130px 1fr; gap:6px 12px; font-size:12px; }
.kv dt { color:var(--ink-light); }
.kv dd { color:var(--ink); }
.muted { color:var(--ink-light); }
.faint { color:var(--ink-faint); }
.small { font-size:11px; }
.tiny { font-size:10px; }
.sec-label { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-faint); margin:12px 0 6px; }
.sec-label:first-child { margin-top:0; }
.empty { color:var(--ink-faint); font-size:12px; display:flex; align-items:center; gap:6px; }
.row { display:flex; align-items:center; gap:8px; }
.between { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.wrap { flex-wrap:wrap; }
.mt8 { margin-top:8px; } .mt12 { margin-top:12px; } .mt16 { margin-top:16px; } .mb8 { margin-bottom:8px; } .mb12 { margin-bottom:12px; } .mb16 { margin-bottom:16px; }

/* Tables */
.dtable { width:100%; border-collapse:collapse; font-size:12px; }
.dtable th { text-align:left; padding:8px 10px; background:var(--neutral-bg); border-bottom:1px solid var(--border); font-weight:600; font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-light); white-space:nowrap; }
.dtable td { padding:9px 10px; border-bottom:1px solid var(--border-light); color:var(--ink-med); vertical-align:top; }
.dtable tr:last-child td { border-bottom:none; }
.dtable tr.click { cursor:pointer; }
.dtable tr.click:hover td { background:#fafafc; }
.dtable tr.sel td { background:#f3f6fd; }
.dtable td.strong { color:var(--ink); font-weight:500; }
.dtable td:first-child { white-space:nowrap; }
.mini-table th { background:none; padding:6px 6px; }
.mini-table td { padding:7px 6px; }

/* Chips */
.chip { font-size:10px; padding:2px 7px; border-radius:4px; font-weight:600; white-space:nowrap; display:inline-flex; align-items:center; gap:4px; line-height:1.5; }
.chip .dot { width:5px; height:5px; border-radius:50%; }
.c-neg { background:var(--negative-bg); color:var(--negative-text); } .c-neg .dot { background:var(--negative); }
.c-pos { background:var(--positive-bg); color:var(--positive-text); } .c-pos .dot { background:var(--positive); }
.c-warn { background:var(--warning-bg); color:var(--warning-text); } .c-warn .dot { background:var(--warning); }
.c-neu { background:var(--neutral-bg); color:var(--ink-light); } .c-neu .dot { background:var(--ink-faint); }
.c-info { background:var(--info-bg); color:var(--info-text); } .c-info .dot { background:#3b8fd0; }
.c-pur { background:var(--purple-bg); color:var(--purple-text); }
.c-ink { background:var(--ink); color:white; }
.c-out { background:white; color:var(--ink-med); border:1px solid var(--border); }
.ai { display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:600; color:#5a3d9e; }
.ai .glow { width:6px; height:6px; border-radius:50%; background:#8b5cf6; animation:glow 2s ease-in-out infinite; }
@keyframes glow { 0%,100%{opacity:1} 50%{opacity:.35} }
.av { width:20px; height:20px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:8px; font-weight:700; color:white; flex-shrink:0; }
.av.PS { background:#b14fc5; } .av.SR { background:#3b82c4; } .av.JJ { background:#d9822b; } .av.JC { background:#16a3a3; } .av.ND { background:#c2417a; } .av.MG { background:#2f9e44; } .av.SYS { background:#8e8e93; } .av.AI { background:#7c5ce0; }

/* Alerts */
.alert { border-radius:10px; padding:10px 14px; font-size:12px; display:flex; gap:10px; align-items:flex-start; }
.alert.warn { background:var(--warning-bg); color:var(--warning-text); }
.alert.neg { background:var(--negative-bg); color:var(--negative-text); }
.alert.info { background:var(--info-bg); color:var(--info-text); }
.alert.neu { background:var(--neutral-bg); color:var(--ink-med); }
.alert b { font-weight:600; }
.alert .ico { font-size:14px; line-height:1.2; }

/* Stat tiles */
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.stat { background:var(--neutral-bg); border-radius:10px; padding:8px 10px; }
.stat .v { font-size:20px; font-weight:700; letter-spacing:-.5px; line-height:1.15; }
.stat .l { font-size:10px; color:var(--ink-light); font-weight:500; }
.stat.neg .v { color:var(--negative-text); } .stat.warn .v { color:var(--warning-text); } .stat.pos .v { color:var(--positive-text); }

/* Stance bar */
.sbar { display:flex; height:10px; border-radius:5px; overflow:hidden; background:var(--neutral-bg); }
.sbar span { display:block; height:100%; }
.legend { display:flex; gap:12px; flex-wrap:wrap; font-size:11px; color:var(--ink-med); margin-top:6px; }
.legend i { width:9px; height:9px; border-radius:2px; display:inline-block; margin-right:4px; vertical-align:-1px; }

/* Tabs */
.tabs { display:flex; border-bottom:2px solid var(--border-light); margin-bottom:16px; gap:0; }
.tab { font-size:13px; padding:9px 18px; color:var(--ink-light); cursor:pointer; font-weight:500; border:none; background:none; position:relative; }
.tab:hover { color:var(--ink-med); }
.tab.active { color:var(--ink); font-weight:600; }
.tab.active::after { content:''; position:absolute; bottom:-2px; left:0; right:0; height:2px; background:var(--ink); border-radius:1px 1px 0 0; }
.tab .cnt { font-size:10px; background:var(--neutral-bg); color:var(--ink-light); padding:1px 6px; border-radius:8px; font-weight:600; margin-left:5px; }
.tab .cnt.neg { background:var(--negative-bg); color:var(--negative-text); }
.filters { display:flex; gap:4px; flex-wrap:wrap; }
.ftab { font-size:11px; padding:4px 11px; border-radius:6px; color:var(--ink-light); cursor:pointer; font-weight:500; border:1px solid transparent; background:none; }
.ftab:hover { background:var(--neutral-bg); }
.ftab.active { background:var(--ink); color:white; }

/* Timeline */
.tl { display:flex; align-items:flex-start; position:relative; margin:10px 0 4px; }
.tl-step { flex:1; text-align:center; position:relative; font-size:11px; }
.tl-step::before { content:''; position:absolute; top:7px; left:-50%; right:50%; height:2px; background:var(--border); z-index:0; }
.tl-step:first-child::before { display:none; }
.tl-step.done::before { background:var(--ink-med); }
.tl-dot { width:16px; height:16px; border-radius:50%; background:white; border:2px solid var(--border); margin:0 auto 4px; position:relative; z-index:1; }
.tl-step.done .tl-dot { background:var(--ink-med); border-color:var(--ink-med); }
.tl-step.now .tl-dot { background:white; border-color:#2f55b8; box-shadow:0 0 0 3px #e7eefc; }
.tl-step b { display:block; font-weight:600; color:var(--ink); }
.tl-step span { color:var(--ink-light); font-size:10px; }

/* Drawer + modal */
.scrim { position:fixed; inset:0; background:rgba(29,29,31,.28); z-index:150; opacity:0; pointer-events:none; transition:opacity .2s; }
.scrim.show { opacity:1; pointer-events:auto; }
.drawer { position:fixed; top:0; right:0; bottom:0; width:640px; max-width:96vw; background:var(--card); z-index:160; box-shadow:var(--shadow-lg); transform:translateX(105%); transition:transform .25s ease; display:flex; flex-direction:column; }
.drawer.show { transform:translateX(0); }
.drawer-h { padding:16px 20px 12px; border-bottom:1px solid var(--border-light); }
.drawer-b { padding:16px 20px 40px; overflow-y:auto; flex:1; }
.drawer-x { border:none; background:none; font-size:18px; color:var(--ink-light); cursor:pointer; border-radius:6px; padding:0 6px; }
.drawer-x:hover { background:var(--neutral-bg); }
.modal { position:fixed; top:50%; left:50%; transform:translate(-50%,-46%); width:520px; max-width:94vw; background:var(--card); border-radius:14px; box-shadow:var(--shadow-lg); z-index:170; opacity:0; pointer-events:none; transition:all .2s; }
.modal.show { opacity:1; pointer-events:auto; transform:translate(-50%,-50%); }
.modal-h { padding:16px 20px 8px; font-size:15px; font-weight:600; }
.modal-b { padding:4px 20px 8px; }
.modal-f { padding:12px 20px 16px; display:flex; justify-content:flex-end; gap:8px; }
.field { margin-bottom:12px; }
.field label { display:block; font-size:11px; font-weight:600; color:var(--ink-med); margin-bottom:4px; }
.field input, .field select, .field textarea { width:100%; font-family:'Inter',sans-serif; font-size:12px; padding:8px 10px; border:1px solid var(--border); border-radius:8px; color:var(--ink); background:white; outline:none; }
.field textarea { min-height:70px; resize:vertical; line-height:1.45; }
.field input:focus, .field select:focus, .field textarea:focus { border-color:var(--ink-faint); box-shadow:0 0 0 3px rgba(0,0,0,.04); }
.field .hint { font-size:10px; color:var(--ink-faint); margin-top:3px; }
.f2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

/* Toggle */
.tgl { display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:12px; user-select:none; }
.tgl input { display:none; }
.tgl .sw { width:30px; height:18px; border-radius:9px; background:var(--border); position:relative; transition:background .15s; flex-shrink:0; }
.tgl .sw::after { content:''; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:white; box-shadow:0 1px 2px rgba(0,0,0,.2); transition:left .15s; }
.tgl input:checked + .sw { background:var(--positive); }
.tgl input:checked + .sw::after { left:14px; }

/* Submission text + extracts */
.subtext { font-size:13px; line-height:1.65; color:var(--ink-med); background:#fcfcfd; border:1px solid var(--border-light); border-radius:10px; padding:12px 14px; }
.subtext p + p { margin-top:8px; }
mark.ex { background:#efe9fb; color:inherit; border-bottom:2px solid #a78bfa; padding:0 1px; border-radius:2px; cursor:pointer; }
mark.ex:hover { background:#e2d7fa; }
mark.ex sup { font-size:9px; font-weight:700; color:#5a3d9e; margin-left:2px; }
.quote { border-left:3px solid #a78bfa; background:#faf8fe; padding:6px 10px; border-radius:0 6px 6px 0; font-size:12px; color:var(--ink-med); font-style:italic; }

/* Issue blocks */
.src-row { display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--border-light); }
.src-row:last-child { border-bottom:none; }
.src-ico { width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; background:var(--neutral-bg); }
.cmt { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--border-light); }
.cmt:last-child { border-bottom:none; }
.cmt-body { flex:1; font-size:12px; color:var(--ink-med); }
.cmt-meta { font-size:11px; color:var(--ink-light); margin-bottom:2px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.cmt.agreed { background:#f2fbf5; margin:0 -10px; padding:10px; border-radius:8px; border-bottom:none; margin-bottom:4px; }
.box { border:1px solid var(--border-light); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
.box-t { font-size:12px; font-weight:600; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
.audit { font-size:11px; color:var(--ink-light); }
.audit div { padding:3px 0; }

/* Map */
.lotmap svg { width:100%; height:auto; display:block; }
.lot { stroke:#c7c7cc; stroke-width:1; fill:#fafafa; cursor:default; }
.lot.notified { fill:#f2f2f7; stroke:#8e8e93; stroke-dasharray:3 2; }
.lot.subject { fill:#1d1d1f; stroke:#1d1d1f; }
.lot.obj { fill:#ffb3ae; stroke:#e5554c; stroke-dasharray:none; cursor:pointer; }
.lot.sup { fill:#b4e6c0; stroke:#34a853; stroke-dasharray:none; cursor:pointer; }
.lot.part { fill:#ffd699; stroke:#e09000; stroke-dasharray:none; cursor:pointer; }
.lot.qa { stroke:#b81d14; stroke-width:2.5; stroke-dasharray:none; }
.lotlabel { font-size:8px; fill:#4a4a4c; pointer-events:none; font-family:Inter,sans-serif; }

/* Overview panels (match product panel size) */
.ogrid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; grid-auto-rows:1fr; }
.op { background:var(--card); border:1px solid var(--border-light); border-radius:10px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; min-height:290px; }
.op-new { border-color:#c9d6f5; box-shadow:0 0 0 2px #eef3fd, var(--shadow-sm); }
.op-h { display:flex; align-items:center; justify-content:space-between; padding:14px 14px 8px; gap:8px; }
.op-t { font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; }
.op-chev { color:var(--ink-light); font-size:13px; padding:0 4px; }
.op-b { padding:4px 14px; flex:1; }
.op-f { padding:8px 14px 14px; }
.op-f .btn { width:100%; justify-content:center; }
.okv { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12px; padding:5px 0; color:var(--ink); }
.okv > span:first-child { color:var(--ink-light); }
.segbar { display:flex; gap:2px; height:22px; }
.segbar span { border:1px solid; border-radius:6px; }
.docrow { font-size:12px; padding:7px 10px; background:var(--neutral-bg); border-radius:4px; margin-bottom:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mapbox { flex:1; min-height:200px; border-radius:6px; overflow:hidden; }
.mapbox svg { width:100%; height:100%; display:block; }
@media (max-width:1100px) { .ogrid { grid-template-columns:repeat(2,1fr); } }
/* Report preview */
.doc { background:white; max-width:860px; margin:0 auto; padding:40px 56px; border-radius:6px; box-shadow:var(--shadow-md); border:1px solid var(--border-light); font-size:13px; color:#222; line-height:1.6; }
.doc h2 { font-size:16px; margin:18px 0 8px; }
.doc h3 { font-size:13px; margin:16px 0 6px; }
.doc p { margin-bottom:8px; }
.doc table { width:100%; border-collapse:collapse; font-size:12px; margin:8px 0 12px; }
.doc th, .doc td { border:1px solid #d1d1d6; padding:6px 8px; text-align:left; vertical-align:top; }
.doc th { background:#f2f2f7; font-weight:600; }
.gen { background:#f6f3fd; border-radius:3px; padding:0 2px; }

function countInfo(s){

  if(s.stance!=='Object' && s.stance!=='Support in part') return {c:false,p:false, why:s.stance};

  if(first && first.id!==s.id) return {c:false, p:false, dup:true, why:`Same property as ${first.id} — property counted once`};

  const sideObj = SUBS.filter(s=>countInfo(s).c && relOf(s)==='Side boundary');

  const sb = ISSUES.filter(i=>i.theme==='Setbacks and building separation' && /side/i.test(i.title));
  const sbOpen = sb.filter(i=>i.status==='Open');
  let r3='Not met', d3='No objection from a side-boundary owner';
  if(sideClaim.length){
    const who = sideClaim.map(s=>LOTS[s.lot].addr.split(' (')[0]+(s.relVal?' (validated)':' (claimed)')).filter((v,ix,a)=>a.indexOf(v)===ix).join(', ');

  return SETTINGS.localSideRule ? [c1,c2,c3] : [c1,c2];
}

function vIssues(){
  const F = { all:['All',()=>true], open:['Open',i=>i.status==='Open'], closed:['Closed',i=>i.status==='Closed'], sub:['Submission-led',isSubLed], sig:['Significant',i=>i.impact==='Significant'], rfi:['Flagged for next RFI',i=>i.rfi.next], norep:['Not in report',i=>!i.report.include] };
  const list = ISSUES.filter(F[state.ifilter][1]);
  const open = ISSUES.filter(i=>i.status==='Open');
  const agreedNoRfi = open.filter(agreedPending);
  let groups;
  if(state.igroup==='cat'){ groups={}; list.forEach(i=>{(groups[i.cat]=groups[i.cat]||[]).push(i)}); }
  else if(state.igroup==='stage'){ groups={}; STAGES.forEach(s=>{const g=list.filter(i=>i.stage===s); if(g.length) groups[s]=g;}); }
  else groups={'':list};

function toggleRfi(id, v){ const i=iss(id); i.rfi.next=v; log(i, v?`Flagged for next RFI (${NEXT_ROUND})`:`Removed from next RFI (${NEXT_ROUND})`); toast(v?`${id} added to ${NEXT_ROUND} draft`:`${id} removed from ${NEXT_ROUND} draft`); refresh(); }

function setF(id,k,v){ const i=iss(id); i[k]=v; log(i,`${k==='rel'?'Planning relevance':k==='impact'?'Impact level':'Theme'} set to ${v}`); refresh(()=>openIssue(id)); }

function addComment(id){ const t=$('ctext').value.trim(); if(!t){toast('Write a comment first');return;} const i=iss(id); const type=$('ctype').value; i.comments.push({by:ME, at:stamp(), type, text:t}); log(i,`Commentary added (${type})`); toast('Commentary added'); refresh(()=>openIssue(id)); }

function openClose(id){
  const i=iss(id); const ag=i.comments.filter(c=>c.type==='Agreed outcome');
  modal(`Close ${id}`, `
   <div class="small muted mb12">${esc(i.title)}</div>
   ${ag.length?`<div class="alert mb12" style="background:#f2fbf5;color:var(--positive-text)"><span class="ico">◎</span><div><b>Agreed outcome to check</b> (${pname(ag[0].by)}, ${ag[0].at.split(',')[0]}): ${esc(ag[0].text)}<label class="row mt8" style="color:var(--ink-med);font-size:12px"><input type="checkbox" id="agck"> I have checked the outcome against the current plans</label></div></div>`:''}
   <div class="field"><label>Resolution</label><select id="ctyp"><option>Design change</option><option>Condition</option><option>No action warranted</option><option>Not a planning matter</option><option>Carried to reasons for refusal</option></select></div>
   <div class="field"><label>Resolution note (required)</label><textarea id="cnote" placeholder="How was this resolved?"></textarea></div>
   <div class="field"><label>Reference <span class="faint">(optional — amended plan revision, drawing or condition number)</span></label><input id="cref" placeholder="e.g. Amendment A1 · DA-201 Rev C · C-08"></div>`,

function doClose(id){ const i=iss(id); const note=$('cnote').value.trim(); if(!note){toast('A resolution note is required');return;}
  if($('agck') && !$('agck').checked){ toast('Confirm you have checked the agreed outcome'); return; }
  const at=stamp(); i.status='Closed'; i.closedBy=ME; i.closedAt=at; i.closure={type:$('ctyp').value, note, ref:$('cref').value.trim()};
  if(i.rfi.next){ i.rfi.next=false; }
  i.reportText = (i.reportText? i.reportText+' ' : '') + 'Resolved: ' + note + (i.closure.ref?` (${i.closure.ref})`:'');
  i.audit.push({at, by:ME, t:`Closed · ${i.closure.type}${i.closure.ref?' · '+i.closure.ref:''}`}); closeModal(); toast(`${id} closed`); refresh(()=>openIssue(id)); }
function openReopen(id){ modal(`Reopen ${id}`, `<div class="field"><label>Reason</label><textarea id="ro"></textarea></div>`, `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="(function(){const r=$('ro').value.trim();if(!r){toast('A reason is required');return;}const i=iss('${id}');i.status='Open';i.closedBy=null;i.closedAt=null;i.closure=null;log(i,'Reopened — '+r);closeModal();toast('${id} reopened');refresh(()=>openIssue('${id}'))})()">Reopen</button>`); }

function doAdd(){ const t=$('nt').value.trim(); if(!t){toast('Give the issue a short description');return;}
  const id='I-'+String(ISSUES.length+1).padStart(2,'0'); const at=stamp(); const k=$('nsk').value, r=$('nsr').value;
  const src = k==='submission' && r!=='other' ? {k, ref:r} : {k, ref: k==='submission'?'Submission (unspecified)':SRC_KIND[k].l, note:''};
  const cat=$('nc').value;
  const i={id, title:t, stage:$('nst').value, cat, theme:$('nth').value, control:'—', rel:cat==='Non-planning'?'Non-planning':'Planning', impact:$('ni').value, status:'Open', openedBy:ME, openedAt:at, closedBy:null, closedAt:null, closure:null,
   sources:[src], rfi:{rounds:[], next:$('nrfi').checked}, rfiText:'', report:{include:$('nrep').checked, section:k==='submission'?'s 4.15(1)(d) Submissions':'s 4.15(1)(b) Likely impacts'}, reportText:'', comments:[], audit:[{at, by:ME, t:`Opened · source: ${$('nst').value}`}]};
  const cm=$('ncm').value.trim(); if(cm) i.comments.push({by:ME, at, type:'Note', text:cm});

/* ================= RFI ================= */
function vRfi(){
  const nextList = rfiIssues();
  const rounds = (nextList.length?[{round:NEXT_ROUND, by:null, status:'Draft'}]:[]).concat(RFI_ROUNDS);
  if(!state.rfiRound || !rounds.find(r=>r.round===state.rfiRound)) state.rfiRound = rounds[0].round;
  const cur = rounds.find(r=>r.round===state.rfiRound); const isDraft = cur.status==='Draft';
  const list = isDraft ? nextList : inRound(cur.round);
  const cand = ISSUES.filter(i=>i.status==='Open' && !i.rfi.next && !i.rfi.rounds.includes('Round 2'));
  const chip = s => s==='Draft'?'<span class="chip c-warn">✎ Draft</span>': s==='In progress'?'<span class="chip c-warn" style="background:#fff8d6">▷ In progress</span>':'<span class="chip c-pos">✓ Closed</span>';
  return `
  <div class="crumbs"><a onclick="go('overview')">Applications</a> / <a onclick="go('overview')">Application ${APP.id}</a></div>
  <div class="page-head"><div class="page-title"><button class="back" onclick="go('overview')">←</button>Manage RFIs</div><div class="head-actions"><button class="btn" onclick="go('issues',{ifilter:'open'})">＋ Add issue</button></div></div>
  <div class="rfi-wrap">
    <div class="card" style="overflow:hidden;align-self:start"><div style="padding:14px 16px" class="panel-t">RFI letters and issues raised</div>
      ${rounds.map(r=>{ const n = r.status==='Draft'?nextList.length:inRound(r.round).length; const sel=r.round===state.rfiRound; return `<div onclick="state.rfiRound='${r.round}';render()" style="cursor:pointer;padding:10px 16px;border-top:1px solid var(--border-light);${sel?'background:#eef3fd;border-left:3px solid #2f55b8':''}"><div class="row"><b>${r.round}</b>${chip(r.status)}</div><div class="tiny muted">${n} issue${n===1?'':'s'}${r.sent?' · sent '+r.sent:''}</div></div>`; }).join('')}
      <div style="padding:12px 16px;background:#fafafc;border-top:1px solid var(--border-light)"><div class="sec-label">Open issues not in an RFI (${cand.length})</div>
      ${cand.length?cand.map(i=>`<div class="between" style="padding:4px 0"><span class="small">${i.id} · ${esc(i.title.length>32?i.title.slice(0,30)+'…':i.title)} ${hasAgreed(i)?'<span class="chip c-pos" title="Agreed outcome recorded">◎</span>':''}</span><button class="btn small" onclick="toggleRfi('${i.id}',true);state.rfiRound='${NEXT_ROUND}'">Add to ${NEXT_ROUND}</button></div>`).join(''):'<div class="small faint">None</div>'}</div>
    </div>
    <div class="card" style="overflow:hidden">
      <div class="between" style="padding:14px 16px"><div><div class="row"><b style="font-size:15px">${cur.round}</b>${chip(cur.status)}</div><div class="small muted">${list.length} issue${list.length===1?'':'s'}${cur.sent?` · sent ${cur.sent} by ${pname(cur.by)}`:' · draft'}</div></div>
        <div class="row">${isDraft?`<button class="btn" onclick="toast('Mark sent — existing RFI workflow')">Mark sent</button><button class="btn primary" onclick="toast('PDF generated (prototype)')">Create PDF</button>`:`<button class="btn" onclick="toast('Responses are managed in the RFI workflow')">View response</button>`}</div></div>
      ${list.map(i=>`<div class="rfi-sec"><div class="rfi-sec-h"><span>${esc(i.title)} <span class="tiny faint">${i.id}${isSubLed(i)?' · raised in submissions':''}${i.status==='Closed'?' · issue closed':''}</span></span><span class="row"><button class="btn small ghost" onclick="openIssue('${i.id}')">Open issue</button>${isDraft?`<button class="btn small ghost" title="Remove from letter" onclick="toggleRfi('${i.id}',false)">🗑</button>`:''}</span></div>
        <div class="rfi-sec-b">${i.rfiText?`<div class="rfi-text">${esc(i.rfiText)}</div>`:`<div class="alert warn"><span class="ico">✎</span><div>No applicant wording yet. <a onclick="openIssue('${i.id}')">Add it in the issue</a>.</div></div>`}</div></div>`).join('')||'<div class="empty" style="padding:16px">No issues in this letter.</div>'}
    </div>
  </div>`;
}

/* ================= REPORT ================= */
function vReport(){
  const cs=commSubs(); const counted=objectingProps().length;
  const by = k => cs.filter(s=>s.stance===k).length;
  const late = cs.filter(s=>s.timing==='late');
  const subIss = ISSUES.filter(i=>isSubLed(i) && i.report.include);
  const other = ISSUES.filter(i=>!isSubLed(i) && i.report.include);
  const unresolved = ISSUES.filter(i=>i.status==='Open' && i.impact==='Significant');
  const resp = i => i.status==='Closed' ? esc(i.reportText||i.closure.note) : (i.reportText?esc(i.reportText)+' <span class="gen" style="background:#fff4e5">[Open — assessment to be completed]</span>':'<span class="gen" style="background:#fff4e5">[Open — response required]</span>');
  return `
  <div class="crumbs"><a onclick="go('overview')">Applications</a> / <a onclick="go('overview')">${APP.id}</a></div>
  <div class="page-head"><div><div class="page-title"><button class="back" onclick="go('overview')">←</button>Delegated report — draft sections</div><div class="page-sub">Generated from Community views and the Issues register. <span class="gen">Shaded text</span> is generated; edit the source issue to change it.</div></div>
    <div class="head-actions"><button class="btn" onclick="go('issues')">Edit issues</button><button class="btn primary" onclick="toast('Inserted into assessment report (prototype)')">Insert into report</button></div></div>
  <div class="doc">
    <h2>Notification and submissions — s 4.15(1)(d)</h2>
    <p class="gen">The application was exhibited from ${NOTIF.start} to ${NOTIF.end} (14 days) under the statewide Community Participation Plan. ${NOTIF.devTypes.map(d=>d.t.toLowerCase()).join(' and ')} are both listed in Table 6 of the Plan, but the application seeks a variation to the height of buildings development standard under clause 4.6 and was therefore exhibited. Notice was given by letter to ${RECIPIENT_COUNT} properties, a site notice, Council's DA tracker and the NSW Planning Portal (EXH-1187420).</p>
    <p class="gen">${cs.length} submissions were received from ${new Set(cs.map(propKey)).size} properties: ${by('Object')} objecting, ${by('Support in part')} supporting in part and ${by('Support')} in support. ${late.length} submission${late.length===1?' was':'s were'} received after the exhibition closed${late.filter(s=>s.include===true).length?` and ${late.filter(s=>s.include===true).length===late.length?'was':'were'} considered`:''}${late.filter(s=>s.include===null).length?' (decision pending)':''}. Correspondence from the applicant's architect is not counted as a submission. Objections were received from ${counted} unique properties for the purposes of the Local Planning Panel referral criteria.</p>
    <h3>Issues raised in submissions</h3>
    <table><tr><th style="width:30%">Issue</th><th style="width:16%">Raised by</th><th>Response</th><th style="width:11%">Status</th></tr>
    ${subIss.map(i=>`<tr><td><b>${esc(i.title)}</b><br><span style="color:#888;font-size:11px">${i.id} · ${i.theme}</span></td><td>${propsForIssue(i).length} propert${propsForIssue(i).length>1?'ies':'y'}</td><td class="gen">${resp(i)}</td><td>${i.status==='Closed'?'Resolved — '+i.closure.type.toLowerCase():'Unresolved'}</td></tr>`).join('')}
    </table>
    <h3>Other matters raised during assessment</h3>
    <table><tr><th style="width:30%">Issue</th><th style="width:16%">Raised in</th><th>Section</th><th style="width:11%">Status</th></tr>${other.map(i=>`<tr><td><b>${esc(i.title)}</b><br><span style="color:#888;font-size:11px">${i.id}</span></td><td>${i.stage}</td><td>${esc(i.report.section)}</td><td>${i.status==='Closed'?'Resolved':'Unresolved'}</td></tr>`).join('')}</table>
    <h3>Unresolved significant issues</h3>
    <p class="gen">${unresolved.length?`The following matters remain unresolved and will form reasons for the recommendation unless addressed: ${unresolved.map(i=>esc(i.title)).join('; ')}.`:'No significant issues remain unresolved.'}</p>
  </div>`;
}

/* ================= DRAWER / MODAL ================= */
let drawerKey=null, lastKey=null, keepScroll=0;
function showDrawer(){ const d=$('drawer'); const b=d.querySelector('.drawer-b'); if(lastKey===drawerKey && keepScroll) b.scrollTop=keepScroll; else b.scrollTop=0; keepScroll=0; lastKey=drawerKey; d.classList.add('show'); $('scrim').classList.add('show'); }
function closeAll(){ drawerKey=null; lastKey=null; $('drawer').classList.remove('show'); $('modal').classList.remove('show'); $('scrim').classList.remove('show'); }
function modal(title, body, foot){ $('modal').innerHTML=`<div class="modal-h">${title}</div><div class="modal-b">${body}</div><div class="modal-f">${foot}</div>`; $('modal').classList.add('show'); $('scrim').classList.add('show'); }
function closeModal(){ $('modal').classList.remove('show'); if(!$('drawer').classList.contains('show')) $('scrim').classList.remove('show'); }
function refresh(reopen){ const d=$('drawer'); const open=d.classList.contains('show'); const b=d.querySelector('.drawer-b'); keepScroll = open&&b? b.scrollTop:0; render(); if(reopen) reopen(); else if(open && drawerKey){ (drawerKey.t==='i'?openIssue:openSub)(drawerKey.id); } }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeAll(); });

render();
</script>
<script src="https://build-au-feedback-widget.vercel.app/feedback-widget.js"></script>
</body>
